name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Red de seguridad. Lo normal es que el deploy lo dispare el backend de
    # Apps Script al publicar/retirar (`webDispararDeploy` → workflow_dispatch).
    # Los programados de GitHub no son puntuales: pueden retrasarse horas o no
    # llegar bajo carga, así que no se usan para garantizar plazos.
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # En cola, no cancelado: un programado no debe abortar el deploy de un push.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Genera src/js/config.js a partir de las variables/secretos del repositorio.
      # Se pueden añadir como Repository variables o Secrets en:
      #   Settings -> Secrets and variables -> Actions
      - name: Generar configuracion
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
          CONTACTO_TELEFONO: ${{ secrets.CONTACTO_TELEFONO || vars.CONTACTO_TELEFONO }}
          CONTACTO_EMAIL: ${{ secrets.CONTACTO_EMAIL || vars.CONTACTO_EMAIL }}
          # Datos de la entidad que firman el contrato: sin ellos el párrafo de
          # la asociación sale sin CIF ni domicilio.
          ASOCIACION_NOMBRE: ${{ secrets.ASOCIACION_NOMBRE || vars.ASOCIACION_NOMBRE }}
          ASOCIACION_CIF: ${{ secrets.ASOCIACION_CIF || vars.ASOCIACION_CIF }}
          ASOCIACION_DOMICILIO: ${{ secrets.ASOCIACION_DOMICILIO || vars.ASOCIACION_DOMICILIO }}
        run: node scripts/gen-config.js

      # Un test en rojo (logica, contraste o integridad) bloquea el despliegue.
      - name: Tests
        run: npm test

      # Prerender SEO del visor: una página estática por ficha, sitemap y robots.
      # Bloquea el despliegue si no puede generar sitemap/robots válidos o si
      # falta alguna ficha (un 200 sin sitemap rompería la indexación).
      - name: Prerender público
        env:
          PUBLIC_WEB_BASE_URL: ${{ vars.PUBLIC_WEB_BASE_URL }}
        run: node scripts/prerender-publico.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true