<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A431E">
  <title>Sin conexion | GN Admin</title>
  <link rel="icon" href="assets/icons/logo-nebak.jpg">
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f5f7;
      color: #1f2937;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .offline-card {
      width: min(420px, 100%);
      padding: 32px 26px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #e8eaed;
      box-shadow: 0 18px 40px -24px rgba(10, 67, 30, .45);
      text-align: center;
    }
    .offline-logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -.02em; }
    p { margin: 0 0 20px; font-size: .9rem; line-height: 1.55; color: #6b7280; }
    .offline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      width: 100%;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #15863D;
      color: #fff;
      font: inherit;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .offline-btn:hover { background: #0f6b31; }
    .offline-note { margin: 16px 0 0; font-size: .72rem; color: #9aa0a6; }
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="assets/icons/logo-nebak.jpg" alt="Grupo Nebak" class="offline-logo">
    <h1>Sin conexion</h1>
    <p>No hemos podido cargar GN Admin. Comprueba tu conexion y vuelve a intentarlo. Las pantallas que ya habias abierto siguen disponibles sin red.</p>
    <button type="button" class="offline-btn" onclick="location.reload()">Reintentar</button>
    <p class="offline-note">Grupo Nebak</p>
  </main>
</body>
</html>
